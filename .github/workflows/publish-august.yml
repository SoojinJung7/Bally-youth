name: Publish August posters (2026-08-01 KST)

# 8월 스케줄 포스터를 8월 1일 00:00 KST에 자동 공개한다.
# august-posters 브랜치를 main 에 병합 + push 하면 GitHub Pages 가 자동 재배포된다.
# 배포가 끝나면 이 워크플로 파일은 삭제해도 된다(재실행돼도 이미 병합돼 있어 no-op).

on:
  schedule:
    # cron 은 UTC 기준. 2026-07-31 15:00 UTC = 2026-08-01 00:00 KST
    - cron: '0 15 31 7 *'
  workflow_dispatch: {}   # 필요 시 Actions 탭에서 수동 실행(테스트/조기 배포) 가능

permissions:
  contents: write
  pages: write

concurrency:
  group: publish-august
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Merge august-posters into main and push
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin august-posters
          git merge --no-ff origin/august-posters \
            -m "Publish 8월 스케줄 포스터 (auto, 2026-08-01 KST)"
          git push origin HEAD:main

      - name: Request GitHub Pages rebuild (fallback)
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
