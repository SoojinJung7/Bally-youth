# ===== BALLY JUNIOR — Sveltia/Decap CMS config =====
backend:
  name: github
  repo: SoojinJung7/bally-junior.com
  branch: main
  # 아래 base_url 은 GitHub 로그인을 처리하는 OAuth 프록시 주소입니다.
  base_url: https://bally-junior-cms-auth.soojinjung7.workers.dev

# 업로드된 사진이 저장되는 repo 폴더
media_folder: "assets/slides"
# 사이트에서 사진을 불러올 때 쓰는 경로
public_folder: "assets/slides"

# 에디터가 PC에서 미리 테스트할 수 있는 로컬 모드 허용
local_backend: true

collections:
  - name: "site"
    label: "사이트"
    files:
      # ========================================
      # 1. 히어로 슬라이드 (메인 상단 사진 회전)
      # ========================================
      - name: "slides"
        label: "히어로 슬라이드"
        file: "assets/slides.json"
        description: "메인 화면 상단에 3초씩 돌아가는 사진들을 관리합니다."
        fields:
          - name: intervalMs
            label: "전환 간격 (밀리초, 3000 = 3초)"
            widget: number
            default: 3000
            value_type: int
            min: 1000
          - name: slides
            label: "슬라이드 목록"
            label_singular: "슬라이드"
            widget: list
            summary: "{{fields.alt}}"
            fields:
              - name: src
                label: "사진"
                widget: image
                choose_url: false
                media_library:
                  config:
                    max_file_size: 8000000
              - name: alt
                label: "사진 설명 (대체 텍스트, 선택)"
                widget: string
                required: false

      # ========================================
      # 2. BALLY 스케치 (홈페이지 영상 섹션)
      # ========================================
      - name: "sketch"
        label: "BALLY 스케치 (영상)"
        file: "assets/sketch.json"
        description: "메인 화면 BALLY SKETCH 섹션의 영상들. YouTube/Vimeo 링크 권장 (사이트가 빨라짐). 직접 업로드한 mp4 경로도 가능."
        fields:
          - name: items
            label: "영상 목록"
            label_singular: "영상"
            widget: list
            summary: "{{fields.title}}"
            fields:
              - name: src
                label: "영상 (파일 업로드 또는 URL)"
                widget: file
                choose_url: true
                media_folder: "/assets/updates"
                public_folder: "/assets/updates"
                media_library:
                  config:
                    max_file_size: 52428800
                hint: "mp4 파일을 직접 업로드하거나(50MB 이하 권장), URL 입력을 눌러 YouTube/Vimeo 링크를 붙여넣으세요 (예: https://www.youtube.com/watch?v=XXXX). 긴 영상은 YouTube에 올리고 링크를 넣는 것이 사이트가 훨씬 빨라집니다."
              - { name: title, label: "제목 (한글)", widget: string }
              - { name: titleEn, label: "제목 (영문)", widget: string }
              - { name: caption, label: "설명 (한글)", widget: text }
              - { name: captionEn, label: "설명 (영문)", widget: text }

      # ========================================
      # 3. BALLY 뉴스 카드 (메인 화면 우측 카루셀)
      # ========================================
      - name: "news"
        label: "BALLY 뉴스 카드"
        file: "assets/news.json"
        description: "메인 화면 우측 BALLY NEWS 캐러셀에 표시되는 카드들. 카드 개수 자유."
        fields:
          - name: items
            label: "뉴스 카드 목록"
            label_singular: "카드"
            widget: list
            summary: "{{fields.title}} — {{fields.date}}"
            fields:
              - { name: title, label: "제목 (한글)", widget: string }
              - { name: titleEn, label: "제목 (영문)", widget: string }
              - { name: body, label: "본문 (한글)", widget: text }
              - { name: bodyEn, label: "본문 (영문)", widget: text }
              - name: date
                label: "날짜"
                widget: string
                hint: "YYYY.MM.DD 형식 (예: 2026.06.21)"
              - name: url
                label: "링크 URL (선택)"
                widget: string
                required: false
                hint: "카드 클릭 시 이동할 페이지. 사이트 내부면 상대 경로 (예: application/promotion.html)."

      # ========================================
      # 4. BALLY 스포츠 (종목 타일 6개)
      # ========================================
      - name: "works"
        label: "BALLY 스포츠 (종목 타일)"
        file: "assets/works.json"
        description: "메인 화면 BALLY SPORTS 섹션의 종목 카드들. 종목 개수 자유."
        fields:
          - name: items
            label: "종목 목록"
            label_singular: "종목"
            widget: list
            summary: "{{fields.num}} — {{fields.name}}"
            fields:
              - { name: num, label: "번호 (예: 01)", widget: string }
              - { name: cat, label: "카테고리 (영문, 상단 작은 글씨)", widget: string }
              - { name: name, label: "이름 (한글)", widget: string }
              - { name: en, label: "이름 (영문)", widget: string }
              - name: img
                label: "배경 사진 (선택)"
                widget: image
                required: false
                choose_url: false
                media_folder: "/assets/sports"
                public_folder: "/assets/sports"
                hint: "비우면 그라데이션만 표시됩니다. 사진을 넣으면 그 위에 브랜드 그라데이션 색이 자동으로 입혀집니다."
              - name: url
                label: "링크 URL (선택)"
                widget: string
                required: false
                hint: "예: application/sports/soccer.html"
              - name: gradFrom
                label: "그라데이션 시작 색상"
                widget: color
                default: "#FF5F14"
              - name: gradTo
                label: "그라데이션 끝 색상"
                widget: color
                default: "#C90404"

      # ========================================
      # 5. 홈페이지 텍스트 (Hero 카피, 섹션 제목, Contact 등)
      # ========================================
      - name: "homepage"
        label: "홈페이지 텍스트"
        file: "assets/homepage.json"
        description: "메인 화면의 텍스트들. 일부 필드는 HTML 태그 사용 가능 (예: <br>, <span class=\"accent\">)."
        fields:
          - name: hero
            label: "히어로 (메인 상단)"
            widget: object
            fields:
              - { name: eyebrow, label: "Eyebrow (한글, 작은 글씨)", widget: string }
              - { name: eyebrowEn, label: "Eyebrow (영문)", widget: string }
              - name: titleLines
                label: "메인 타이틀 (한글)"
                widget: list
                hint: "각 항목이 한 줄. HTML 가능 (예: <span class=\"accent\">YOUNG</span>)"
                field: { name: line, label: "줄", widget: string }
              - name: titleLinesEn
                label: "메인 타이틀 (영문)"
                widget: list
                field: { name: line, label: "줄", widget: string }
              - { name: cta, label: "버튼 라벨 (한글)", widget: string }
              - { name: ctaEn, label: "버튼 라벨 (영문)", widget: string }
          - name: sketch
            label: "BALLY 스케치 섹션 제목"
            widget: object
            fields:
              - { name: title, label: "제목 (한글)", widget: string }
              - { name: titleEn, label: "제목 (영문)", widget: string }
          - name: sports
            label: "BALLY 스포츠 섹션 제목·설명"
            widget: object
            fields:
              - { name: title, label: "제목 (한글)", widget: string }
              - { name: titleEn, label: "제목 (영문)", widget: string }
              - { name: desc, label: "설명 (한글)", widget: string }
              - { name: descEn, label: "설명 (영문)", widget: string }
          - name: news
            label: "BALLY 뉴스 섹션 제목"
            widget: object
            fields:
              - { name: title, label: "제목 (한글)", widget: string }
              - { name: titleEn, label: "제목 (영문)", widget: string }
          - name: contact
            label: "Contact 섹션 (하단 CTA)"
            widget: object
            fields:
              - name: heading
                label: "헤딩 (한글, HTML 가능)"
                widget: text
                hint: "줄바꿈은 <br />. 강조 단어는 <span class=\"accent\">강조</span>"
              - { name: headingEn, label: "헤딩 (영문, HTML 가능)", widget: text }
              - { name: cta, label: "버튼 라벨 (한글)", widget: string }
              - { name: ctaEn, label: "버튼 라벨 (영문)", widget: string }
          - name: footer
            label: "Footer"
            widget: object
            fields:
              - name: copyright
                label: "Copyright 텍스트 (HTML 가능)"
                widget: string
                hint: "예: © <span id=\"year\">2026</span> BALLY YOUTH SPORTSCLUB - Electree Co.Ltd."

      # ========================================
      # 6. 플레이어 카드 (/players 페이지)
      # ========================================
      - name: "players"
        label: "플레이어 카드"
        file: "assets/players.json"
        description: "/players 페이지의 발리 유소년 선수 카드들. 카드마다 사진·포지션·스탯을 자유롭게 편집하세요. 등급(OVR)은 스탯 6개의 평균으로 자동 계산됩니다."
        fields:
          - name: page
            label: "페이지 상단 (제목·소개)"
            widget: object
            fields:
              - { name: eyebrow, label: "작은 라벨 (영문)", widget: string }
              - { name: title, label: "제목 (한글, HTML 가능 — <br>로 줄바꿈)", widget: string }
              - { name: titleEn, label: "제목 (영문)", widget: string }
              - { name: desc, label: "소개 문구 (한글)", widget: text }
              - { name: descEn, label: "소개 문구 (영문)", widget: text }
          - { name: featuredLabel, label: "상단 섹션 제목 (한글)", widget: string, default: "이달의 플레이어" }
          - { name: featuredLabelEn, label: "상단 섹션 제목 (영문)", widget: string, default: "Players of the Month" }
          - { name: allLabel, label: "전체 섹션 제목 (한글)", widget: string, default: "전체 플레이어" }
          - { name: allLabelEn, label: "전체 섹션 제목 (영문)", widget: string, default: "All Players" }
          - name: players
            label: "선수 목록"
            label_singular: "선수"
            widget: list
            summary: "{{fields.name}} · {{fields.position}}"
            fields:
              - { name: name, label: "이름 (한글)", widget: string }
              - { name: nameEn, label: "이름 (영문/로마자)", widget: string }
              - name: position
                label: "포지션 (짧게, 예: FW · MF · GK)"
                widget: string
                hint: "카드 왼쪽에 표시되는 포지션 약자."
              - { name: sport, label: "종목 (한글, 예: 축구)", widget: string }
              - { name: sportEn, label: "종목 (영문, 예: Soccer)", widget: string }
              - name: photo
                label: "사진 (선택)"
                widget: image
                required: false
                choose_url: false
                media_folder: "/assets/players"
                public_folder: "/assets/players"
                hint: "비우면 이름 첫 글자가 표시됩니다."
              - name: flag
                label: "국기"
                widget: string
                default: "KR"
                hint: "KR = 태극기 (기본값). 다른 나라는 국기 이모지를 입력 (예: 🇺🇸)."
              - name: featured
                label: "이달의 플레이어로 상단 노출"
                widget: boolean
                default: false
              - name: tier
                label: "카드 등급 (색상)"
                widget: select
                default: "gold"
                options:
                  - { label: "골드 (기본)", value: "gold" }
                  - { label: "시그니처 (특별 · 오렌지)", value: "signature" }
              - name: rating
                label: "등급 OVR (선택 — 비우면 스탯 평균 자동계산)"
                widget: number
                required: false
                value_type: int
                min: 1
                max: 99
              - name: stats
                label: "평가 스탯 (6개 권장)"
                label_singular: "스탯"
                widget: list
                summary: "{{fields.label}} · {{fields.value}}"
                hint: "예: 실력 / 태도 / 예절 / 리더 / 협동 / 열정"
                fields:
                  - { name: label, label: "항목 (한글, 짧게)", widget: string }
                  - { name: labelEn, label: "항목 (영문, 짧게 — 예: SKL)", widget: string }
                  - name: value
                    label: "점수 (1–99)"
                    widget: number
                    value_type: int
                    min: 1
                    max: 99
